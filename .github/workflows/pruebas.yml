name: Pruebas

# Corre las pruebas en cada PR y en cada push que toque codigo. Los commits del
# robot (estado en datos/ y docs/) no las disparan.
on:
  pull_request:
  push:
    paths:
      - "**.py"
      - "tests/**"
      - "herramientas/**"
      - "requirements*.txt"
      - "pytest.ini"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # igual que en el robot: si apt se cuelga, ffmpeg estatico
      - name: ffmpeg
        timeout-minutes: 8
        run: |
          if ! command -v ffmpeg >/dev/null; then
            if ! timeout 150 bash -c 'sudo apt-get update -qq -o Acquire::http::Timeout=20 -o Acquire::Retries=2 && sudo apt-get install -y -qq ffmpeg'; then
              echo "apt no respondio; se usa ffmpeg estatico"
              curl -sSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C /tmp
              sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
            fi
          fi
          ffmpeg -version | head -1

      - name: Dependencias
        run: pip install --quiet -r requirements-dev.txt

      - name: Pruebas
        run: python -m pytest -q --durations=5
