name: El Ahorita

# Una sola tuberia: cada 5 minutos el orquestador decide que toca.
# El cron de GitHub es "mejor esfuerzo": a veces salta pasadas. Para uso serio,
# disparar tambien desde fuera (cron-job.org) contra la API de GitHub.
# La hora se calcula en Tijuana dentro del script, asi que el cambio de horario
# no exige tocar los cron.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      forzar_franja:
        description: "Mandar candidatas ahora mismo"
        type: boolean
        default: false

concurrency:
  group: el-ahorita
  cancel-in-progress: false

jobs:
  pasada:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet edge-tts pillow

      - name: Secretos
        run: |
          {
            echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY || secrets.LLM_API_KEY }}"
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}"
            echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}"
            echo "YT_CLIENT_ID=${{ secrets.YT_CLIENT_ID }}"
            echo "YT_CLIENT_SECRET=${{ secrets.YT_CLIENT_SECRET }}"
            echo "YT_REFRESH_TOKEN=${{ secrets.YT_REFRESH_TOKEN }}"
            echo "YT_PRIVACIDAD=${{ vars.YT_PRIVACIDAD || 'private' }}"
          } > .env
          grep -c . .env

      - name: Revisar claves
        run: python herramientas/estado-claves.py || true

      - name: Pasada
        run: |
          set -o pipefail
          if [ "${{ inputs.forzar_franja }}" = "true" ]; then
            python orquestador.py --franja 2>&1 | tee datos/ultimo-log.txt
          else
            python orquestador.py 2>&1 | tee datos/ultimo-log.txt
          fi
          # el log queda en el repo: asi se puede revisar que paso sin acceso a Actions
          tail -c 20000 datos/ultimo-log.txt > datos/ultimo-log.txt.tmp
          mv datos/ultimo-log.txt.tmp datos/ultimo-log.txt

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "el-ahorita"
          git config user.email "bot@elahorita.local"
          git add -A datos docs
          git diff --quiet --cached || git commit -m "estado: $(date -u +%Y-%m-%dT%H:%M)"
          # el offset de Telegram vive aqui: si el push falla se pierde y el bot
          # repetiria la misma orden. Se reintenta con rebase.
          for i in 1 2 3; do
            if git push; then break; fi
            echo "push rechazado, reintento $i"
            git pull --rebase --autostash || true
            sleep 3
          done
