name: El Ahorita

# Una sola tuberia: cada 5 minutos el orquestador decide que toca.
# El cron de GitHub es "mejor esfuerzo": a veces salta pasadas. Para uso serio,
# disparar tambien desde fuera (cron-job.org) contra la API de GitHub.
# La hora se calcula en Tijuana dentro del script, asi que el cambio de horario
# no exige tocar los cron.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      probar_franja:
        description: "Probar una franja ahora: el video llega al chat y NO se sube ni se guarda nada"
        type: choice
        options: ["no", "madrugada", "manana", "tarde", "noche"]
        default: "no"
      probar_voz:
        description: "Solo probar la voz (ElevenLabs): genera una frase y te la manda al chat"
        type: boolean
        default: false
      probar_nota:
        description: "Probar /nota con este tema: el video llega al chat y NO se sube a YouTube"
        type: string
        default: ""
      probar_secciones:
        description: "Medir el clasificador de secciones (palabras y DeepSeek) contra 250 noticias clasificadas a mano"
        type: boolean
        default: false
      probar_mensajes:
        description: "Mandar al chat un /estado y un resumen del dia de ejemplo (no cambia nada)"
        type: boolean
        default: false

# la prueba de voz va en su propia cola: si se atora, no bloquea al robot
concurrency:
  group: ${{ (inputs.probar_voz || inputs.probar_nota || inputs.probar_secciones || inputs.probar_mensajes || (inputs.probar_franja && inputs.probar_franja != 'no')) && 'el-ahorita-prueba' || 'el-ahorita' }}
  cancel-in-progress: false

jobs:
  pasada:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      # la punta de la rama al ARRANCAR, no el commit de cuando se lanzo la corrida:
      # una corrida que espero en la cola veria el estado viejo y repetiria la franja
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        timeout-minutes: 8
        # apt a veces se cuelga en los runners de GitHub: si no responde en 150 s,
        # se baja ffmpeg estatico (con ffprobe, libmp3lame y prores) de GitHub.
        run: |
          if ! command -v ffmpeg >/dev/null; then
            if ! timeout 150 bash -c 'sudo apt-get update -qq -o Acquire::http::Timeout=20 -o Acquire::Retries=2 && sudo apt-get install -y -qq ffmpeg'; then
              echo "apt no respondio; se usa ffmpeg estatico"
              curl -sSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C /tmp
              sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
            fi
          fi
          ffmpeg -version | head -1
          pip install --quiet edge-tts pillow

      - name: Secretos
        run: |
          {
            echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY || secrets.LLM_API_KEY }}"
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}"
            echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}"
            echo "YT_CLIENT_ID=${{ secrets.YT_CLIENT_ID }}"
            echo "YT_CLIENT_SECRET=${{ secrets.YT_CLIENT_SECRET }}"
            echo "YT_REFRESH_TOKEN=${{ secrets.YT_REFRESH_TOKEN }}"
            echo "YT_PRIVACIDAD=${{ vars.YT_PRIVACIDAD || 'private' }}"
            echo "MUSICA_CREDITO=${{ vars.MUSICA_CREDITO }}"
            # Voicebox se acepta como Variable o como Secret, con cualquiera de
            # los dos nombres del perfil
            echo "VOICEBOX_URL=${{ vars.VOICEBOX_URL || secrets.VOICEBOX_URL }}"
            echo "VOICEBOX_PROFILE_ID=${{ vars.VOICEBOX_PROFILE || vars.VOICEBOX_PROFILE_ID || secrets.VOICEBOX_PROFILE || secrets.VOICEBOX_PROFILE_ID }}"
            echo "VOICEBOX_ENGINE=${{ vars.VOICEBOX_ENGINE }}"
            echo "WHISPER_MODELO=${{ vars.WHISPER_MODELO || 'small' }}"
            # ElevenLabs: la llave como Secret; la voz y el modelo como Variable o Secret
            echo "ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}"
            echo "ELEVENLABS_VOICE_ID=${{ vars.ELEVENLABS_VOICE_ID || secrets.ELEVENLABS_VOICE_ID }}"
            echo "ELEVENLABS_MODEL=${{ vars.ELEVENLABS_MODEL }}"
            echo "ELEVENLABS_SPEED=${{ vars.ELEVENLABS_SPEED }}"
          } > .env
          grep -c . .env

      # `secrets` no se puede usar en un `if`, pero si en `env`: este paso dice si
      # hay Voicebox y llave de Tailscale, y el siguiente decide con eso.
      # Con ElevenLabs configurado no se usa Voicebox: ni Tailscale ni Whisper.
      - name: Hay Voicebox
        id: vb
        env:
          URL: ${{ vars.VOICEBOX_URL || secrets.VOICEBOX_URL }}
          LLAVE: ${{ secrets.TS_AUTHKEY }}
          ELEVEN: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -n "$ELEVEN" ]; then echo "si=false" >> "$GITHUB_OUTPUT"; echo "voz: ElevenLabs"
          elif [ -n "$URL" ] && [ -n "$LLAVE" ]; then echo "si=true" >> "$GITHUB_OUTPUT"
          else echo "si=false" >> "$GITHUB_OUTPUT"; echo "sin ElevenLabs ni Voicebox: va la voz de respaldo"; fi

      # Voicebox no da tiempos por palabra: Whisper los saca para los subtitulos.
      # El modelo (~480 MB) se guarda en cache para no bajarlo en cada pasada.
      - name: Cache de Whisper
        if: ${{ steps.vb.outputs.si == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ vars.WHISPER_MODELO || 'small' }}-v1

      - name: Whisper
        if: ${{ steps.vb.outputs.si == 'true' }}
        run: pip install --quiet faster-whisper

      # continue-on-error: si Tailscale falla, el video sale con la voz de respaldo.
      - name: Tailscale
        if: ${{ steps.vb.outputs.si == 'true' }}
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          version: latest

      - name: Revisar claves
        run: python herramientas/estado-claves.py || true

      # modo prueba: no toca Telegram ni el estado, solo la voz
      - name: Probar voz
        if: ${{ inputs.probar_voz }}
        run: python herramientas/probar-voz.py

      # el tema va por env, no pegado en el comando: asi un tema con comillas o
      # $(...) no puede ejecutar nada en el runner
      - name: Probar /nota
        if: ${{ inputs.probar_nota }}
        env:
          TEMA: ${{ inputs.probar_nota }}
        run: python nota.py "$TEMA" --prueba

      - name: Probar mensajes
        if: ${{ inputs.probar_mensajes }}
        run: |
          python orquestador.py --mostrar estado
          python orquestador.py --mostrar resumen

      - name: Medir secciones
        if: ${{ inputs.probar_secciones }}
        run: python herramientas/evaluar-secciones.py --ia --errores

      - name: Probar franja
        if: ${{ inputs.probar_franja && inputs.probar_franja != 'no' }}
        env:
          FRANJA: ${{ inputs.probar_franja }}
        run: python orquestador.py --franja "$FRANJA" --prueba

      - name: Pasada
        if: ${{ !inputs.probar_voz && !inputs.probar_nota && !inputs.probar_secciones && !inputs.probar_mensajes && (!inputs.probar_franja || inputs.probar_franja == 'no') }}
        run: |
          set -o pipefail
          python orquestador.py 2>&1 | tee datos/ultimo-log.txt
          # el log queda en el repo: asi se puede revisar que paso sin acceso a Actions
          tail -c 20000 datos/ultimo-log.txt > datos/ultimo-log.txt.tmp
          mv datos/ultimo-log.txt.tmp datos/ultimo-log.txt

      - name: Guardar estado
        if: ${{ always() && !inputs.probar_voz && !inputs.probar_nota && !inputs.probar_secciones && !inputs.probar_mensajes && (!inputs.probar_franja || inputs.probar_franja == 'no') }}
        run: |
          git config user.name "el-ahorita"
          git config user.email "bot@elahorita.local"
          git add -A datos docs
          git diff --quiet --cached || git commit -m "estado: $(date -u +%Y-%m-%dT%H:%M)"
          # el offset de Telegram vive aqui: si el push falla se pierde y el bot
          # repetiria la misma orden. Se reintenta con rebase.
          for i in 1 2 3; do
            if git push; then break; fi
            echo "push rechazado, reintento $i"
            # si el rebase choca, gana lo de esta corrida (es lo mas nuevo) y no se
            # queda un rebase a medias que tumbe los demas intentos
            git pull --rebase --autostash -X theirs || git rebase --abort || true
            sleep 3
          done
